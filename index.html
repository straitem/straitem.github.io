<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlimmerVale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050309;
      font-family: "Plus Jakarta Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 18%, rgba(86, 108, 178, 0.45) 0%, rgba(26, 20, 56, 0.72) 45%, #050309 82%),
        linear-gradient(180deg, #3f5396 0%, #1d173d 42%, #07040e 75%, #030207 100%);
    }

    /* Glittering ridge & glowing meadow flowers backdrop */
    .scene::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 130% 24% at 50% 42%, rgba(255, 246, 255, 0.92) 0%, rgba(196, 152, 255, 0.55) 28%, rgba(45, 22, 85, 0.12) 65%, transparent 80%),
        radial-gradient(circle at 12% 76%, rgba(255, 196, 182, 0.85) 0px, rgba(168, 142, 255, 0.35) 14px, transparent 30px),
        radial-gradient(circle at 24% 68%, rgba(255, 214, 190, 0.78) 0px, rgba(140, 175, 255, 0.28) 11px, transparent 24px),
        radial-gradient(circle at 36% 79%, rgba(255, 185, 175, 0.9) 0px, rgba(182, 130, 255, 0.35) 16px, transparent 34px),
        radial-gradient(circle at 63% 77%, rgba(255, 204, 186, 0.85) 0px, rgba(165, 145, 255, 0.3) 13px, transparent 28px),
        radial-gradient(circle at 78% 71%, rgba(255, 220, 198, 0.82) 0px, rgba(155, 185, 255, 0.28) 12px, transparent 26px),
        radial-gradient(circle at 89% 63%, rgba(255, 192, 176, 0.88) 0px, rgba(175, 135, 255, 0.32) 15px, transparent 32px);
      opacity: 0.95;
    }

    /* Top slot matching the green circle region */
    .top-bolster-wrap {
      position: absolute;
      top: 4%;
      left: 50%;
      transform: translateX(-50%);
      width: min(420px, 82vw);
      height: 150px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bolster-root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: visible;
      touch-action: pan-y;
    }

    .bolster-stage {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .bolster-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .bolster-hit {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 9999px;
      background: transparent;
      border: none;
      padding: 0;
      margin: 0;
      cursor: pointer;
      pointer-events: auto;
      outline-offset: 4px;
      -webkit-tap-highlight-color: transparent;
    }

    .bolster-hit:focus-visible {
      outline: 3px solid rgba(217, 255, 212, 0.75);
    }

    /* Lower foreground text matching the green rectangle area */
    .touch-grass-label {
      position: absolute;
      left: 50%;
      bottom: 22%;
      transform: translateX(-50%);
      z-index: 15;
      color: #a855f7;
      font-weight: 800;
      font-size: clamp(1.75rem, 4vw, 3.2rem);
      letter-spacing: -0.02em;
      text-align: center;
      white-space: nowrap;
      text-shadow: 0 2px 18px rgba(88, 28, 135, 0.65), 0 0 28px rgba(168, 85, 247, 0.35);
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <div class="top-bolster-wrap">
      <div class="bolster-root" id="bolsterRoot">
        <div class="bolster-stage" id="bolsterStage">
          <canvas class="bolster-canvas" id="bolsterCanvas"></canvas>
          <a class="bolster-hit" id="bolsterHit" href="download.html" aria-label="Download"></a>
        </div>
      </div>
    </div>

    <div class="touch-grass-label" aria-label="Touch Grass"> Touch Grass</div>
  </main>

  <script>
    (function () {
      const MARGIN = 0.8;
      const GRID_PITCH = 0.05;
      const STEP = 1 / 120;
      const RIM_H = 0.045;
      const RIM_W = 0.075;
      const DOME_H = 0.2;
      const DOME_W0 = 0.34;
      const DOME_W1 = 0.3;
      const HOVER_GROW = 0.065;
      const REST_PUFF = 0.35;
      const LIGHT_FALLOFF = 0.3;
      const SHOULDER = 0.3;
      const HOVER_HYST = 0.02;
      const SWELL_SIGMA = 0.45;
      const SWELL_XY = 0.34;
      const SWELL_Z = 0.3;
      const FAR_SHRINK = 0.03;
      const RIM_ZONE = 0.3;
      const PRESS_SIGMA = 0.3;
      const PRESS_Z = 0.36;
      const PRESS_SQUASH = 0.03;
      const MEM_W = 13;
      const INF_W = 12;
      const DWELL_SHARE = 0.22;
      const DWELL_TAU = 0.6;
      const WAKE_GAIN = 0.08;
      const WAKE_MAX = 0.4;
      const MEM_T = 3;
      const CRAWL_REST = 1.0;
      const CRAWL_ACTIVE = 1.0;
      const CRAWL_CYCLE = 1024;
      const RIPPLE_SPEED = 1.6;
      const RIPPLE_DAMP = 9;
      const RIPPLE_SIGMA = 0.12;
      const RIPPLE_GAIN = 1.4;
      const FOLD_DRIFT = 0.45;
      const CLOTH_W = 256;
      const CLOTH_H = 128;
      const CLOTH_TX = 3.2;
      const CLOTH_TY = 1.6;

      const CFG = {
        text: "Download",
        textColor: "#D9FFD4",
        buttonWidth: 240,
        buttonHeight: 82,
        radius: 41,
        fabric: "#4B8A10",
        drift: 5,
        reach: 0,
        puff: 5,
        bulge: 5,
        press: 5,
        wobble: 5,
        drag: 5,
        ripple: 5,
        release: 0.7,
        nap: 100,
        pile: 100,
        wrinkles: 100,
        sheen: 100,
        fuzz: 0.45,
        hem: 5,
        lightAngle: 35,
        lightHeight: 41,
        shadow: 28,
        glow: 0,
      };

      function clamp(x, a, b) {
        return x < a ? a : x > b ? b : x;
      }

      function mulberry(seed) {
        let s = seed >>> 0;
        return () => {
          s = (s + 0x6d2b79f5) >>> 0;
          let t = s;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function srgbToLin(c) {
        return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      }

      function hexToLin(hex) {
        const clean = hex.replace("#", "");
        const r = parseInt(clean.slice(0, 2), 16) / 255;
        const g = parseInt(clean.slice(2, 4), 16) / 255;
        const b = parseInt(clean.slice(4, 6), 16) / 255;
        return [srgbToLin(r), srgbToLin(g), srgbToLin(b)];
      }

      function bakeCloth() {
        const W = CLOTH_W;
        const H = CLOTH_H;
        const rnd = mulberry(20261026);
        const gauss = () => Math.sqrt(-2 * Math.log(1 - rnd())) * Math.cos(2 * Math.PI * rnd());
        const nap = new Float32Array(W * H);
        const fold = new Float32Array(W * H);
        const fx = new Float32Array(W * H);
        const fy = new Float32Array(W * H);
        const cu = new Float32Array(W);
        const su = new Float32Array(W);
        const cv = new Float32Array(H);
        const sv = new Float32Array(H);
        const addModes = (count, fyMean, fySpread, fxSpread, target, grads) => {
          for (let k = 0; k < count; k++) {
            const n = Math.max(1, Math.round(Math.abs(fyMean + fySpread * gauss()) * CLOTH_TY));
            const m = Math.round(fxSpread * gauss() * CLOTH_TX);
            const ph = rnd() * Math.PI * 2;
            const a = 0.5 + rnd();
            for (let i = 0; i < W; i++) {
              const t = (2 * Math.PI * m * i) / W + ph;
              cu[i] = Math.cos(t);
              su[i] = Math.sin(t);
            }
            for (let j = 0; j < H; j++) {
              const t = (2 * Math.PI * n * j) / H;
              cv[j] = Math.cos(t);
              sv[j] = Math.sin(t);
            }
            const gx = (a * 2 * Math.PI * m) / CLOTH_TX;
            const gy = (a * 2 * Math.PI * n) / CLOTH_TY;
            for (let j = 0; j < H; j++) {
              const row = j * W;
              const c2 = cv[j];
              const s2 = sv[j];
              for (let i = 0; i < W; i++) {
                const c = cu[i] * c2 - su[i] * s2;
                target[row + i] += a * c;
                if (grads) {
                  const s = su[i] * c2 + cu[i] * s2;
                  fx[row + i] -= gx * s;
                  fy[row + i] -= gy * s;
                }
              }
            }
          }
        };
        addModes(96, 3.0, 1.1, 0.8, nap, false);
        addModes(36, 3.6, 1.2, 0.25, fold, true);
        const norm = (a) => {
          let s = 0;
          for (let i = 0; i < a.length; i++) s += a[i] * a[i];
          return 1 / Math.sqrt(s / a.length || 1);
        };
        const kn = norm(nap);
        const kf = norm(fold);
        const out = new Float32Array(W * H * 4);
        for (let i = 0; i < W * H; i++) {
          out[i * 4] = clamp(nap[i] * kn, -2.5, 2.5);
          out[i * 4 + 1] = fold[i] * kf;
          out[i * 4 + 2] = fx[i] * kf;
          out[i * 4 + 3] = fy[i] * kf;
        }
        return out;
      }

      function bakeNoise() {
        const N = 256;
        const rnd = mulberry(77);
        const w = new Float32Array(N * N);
        for (let i = 0; i < w.length; i++) w[i] = rnd();
        const out = new Uint8Array(N * N * 4);
        for (let j = 0; j < N; j++) {
          for (let i = 0; i < N; i++) {
            const k = j * N + i;
            const r = (w[k] + w[j * N + ((i + 1) % N)]) * 0.5;
            out[k * 4] = Math.round(clamp((r - 0.5) * 1.6 + 0.5, 0, 1) * 255);
            out[k * 4 + 1] = Math.floor(rnd() * 256);
            out[k * 4 + 2] = Math.floor(rnd() * 256);
            out[k * 4 + 3] = Math.floor(rnd() * 256);
          }
        }
        return out;
      }

      const VERT = `#version 300 es
      void main() {
        vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
        gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
      }`;

      const FRAG = `#version 300 es
      precision highp float;
      precision highp sampler2D;
      uniform vec2 uCanvas;
      uniform vec2 uOrigin;
      uniform float uUpp;
      uniform float uUcss;
      uniform vec2 uHalf;
      uniform float uRad;
      uniform vec4 uGrid;
      uniform float uDeform;
      uniform float uInflate;
      uniform float uScale;
      uniform float uPhase;
      uniform float uActive;
      uniform vec3 uFabric;
      uniform vec3 uSheenCol;
      uniform vec3 uInk;
      uniform float uInkOn;
      uniform vec3 uLight;
      uniform vec4 uLook;
      uniform vec4 uEdge;
      uniform sampler2D uGridTex;
      uniform sampler2D uGridGrad;
      uniform sampler2D uCloth;
      uniform sampler2D uNoise;
      uniform sampler2D uLabel;
      out vec4 outColor;

      float sdRR(vec2 p, vec2 b, float r) {
        vec2 q = abs(p) - b + r;
        return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
      }

      vec2 nRR(vec2 p, vec2 b, float r) {
        vec2 q = abs(p) - b + r;
        vec2 s = vec2(p.x < 0.0 ? -1.0 : 1.0, p.y < 0.0 ? -1.0 : 1.0);
        if (q.x > 0.0 && q.y > 0.0) return normalize(q) * s;
        return q.x > q.y ? vec2(s.x, 0.0) : vec2(0.0, s.y);
      }

      vec2 crawlOffset(float k) {
        k = mod(k, ${CRAWL_CYCLE.toFixed(1)});
        return fract(vec2(sin(k * 12.9898), sin(k * 78.233)) * 43758.5453);
      }

      vec4 cubicW(float v) {
        vec4 n = vec4(1.0, 2.0, 3.0, 4.0) - v;
        vec4 s = n * n * n;
        float x = s.x;
        float y = s.y - 4.0 * s.x;
        float z = s.z - 4.0 * s.y + 6.0 * s.x;
        return vec4(x, y, z, 6.0 - x - y - z) * (1.0 / 6.0);
      }

      vec4 lattice(sampler2D tex, vec2 q) {
        vec2 size = vec2(textureSize(tex, 0));
        vec2 t = (q - uGrid.xy) / uGrid.zw * (size - 1.0);
        vec2 f = fract(t);
        t -= f;
        vec4 xc = cubicW(f.x);
        vec4 yc = cubicW(f.y);
        vec4 c = t.xxyy + vec2(-0.5, 1.5).xyxy + 0.5;
        vec4 s = vec4(xc.xz + xc.yw, yc.xz + yc.yw);
        vec4 o = (c + vec4(xc.yw, yc.yw) / s) / size.xxyy;
        vec4 s0 = texture(tex, o.xz);
        vec4 s1 = texture(tex, o.yz);
        vec4 s2 = texture(tex, o.xw);
        vec4 s3 = texture(tex, o.yw);
        float sx = s.x / (s.x + s.y);
        float sy = s.z / (s.z + s.w);
        return mix(mix(s3, s2, sx), mix(s1, s0, sx), sy);
      }

      float pillow(float e) {
        float t0 = clamp(e / ${RIM_W.toFixed(4)}, 0.0, 1.0);
        float z = ${RIM_H.toFixed(4)} * sqrt(1.0 - (1.0 - t0) * (1.0 - t0));
        float w1 = max(0.05, ${DOME_W0.toFixed(4)} + ${DOME_W1.toFixed(4)} * uInflate);
        float t1 = clamp(e / w1, 0.0, 1.0);
        float u = 1.0 - t1;
        z += ${DOME_H.toFixed(4)} * uInflate * sqrt(1.0 - u * u * u);
        return z;
      }

      vec3 toSrgb(vec3 c) {
        c = max(c, 0.0);
        return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));
      }

      vec3 velour(vec3 N, vec3 albedo, float nap, float grain, float illum) {
        float NoL = dot(N, uLight);
        float NoV = clamp(N.z, 0.0, 1.0);
        float diff = clamp((NoL + 0.4) / 1.4, 0.0, 1.0);
        vec3 col = albedo * (0.12 + 1.137 * diff * diff) * illum;
        float napL = nap > 0.0 ? nap * 1.35 : nap * 0.55;
        col *= (1.0 + 0.3 * uLook.x * napL) * (1.0 + 0.75 * uLook.y * grain);
        float rim = pow(1.0 - NoV, 2.4);
        float lit = 0.1 + 1.05 * clamp(NoL + 0.3, 0.0, 1.3);
        col += uSheenCol * uLook.w * rim * lit * illum * (1.0 + 0.4 * uLook.x * napL) * (1.0 + 0.75 * uLook.y * grain);
        float toward = max(NoL - uLight.z * 0.97, 0.0);
        col += uSheenCol * uLook.w * ${SHOULDER.toFixed(2)} * toward * illum * (1.0 + 0.75 * uLook.y * grain);
        return col;
      }

      void main() {
        vec2 fc = vec2(gl_FragCoord.x, uCanvas.y - gl_FragCoord.y);
        vec2 p = uOrigin + fc * uUpp;
        vec2 q = p / uScale;
        vec4 D = vec4(0.0);
        if (uDeform > 0.0) {
          D = lattice(uGridTex, q);
          q = (p - D.xy) / uScale;
        }
        float hem = uEdge.y;
        float aa = uUpp;
        vec3 dither = texelFetch(uNoise, ivec2(gl_FragCoord.xy) & 255, 0).rgb - 0.5;

        float lift = 0.035 + 0.05 * uInflate;
        float dSh = max(sdRR(q - vec2(0.012, lift), uHalf + vec2(0.0, 0.01), uRad), 0.0);
        float shadow = uEdge.z * (0.55 * exp(-dSh / 0.03) + 0.45 * exp(-dSh / (0.14 + 0.06 * uInflate)));
        float sdOut = min(sdRR(q, uHalf, uRad), sdRR(q - vec2(0.0, hem * 0.5), uHalf + vec2(0.0, hem * 0.5), uRad));
        float dg = max(sdOut, 0.0) / 0.25;
        vec3 glow = toSrgb(uSheenCol * uEdge.w * 0.022 * exp(-dg * dg));
        vec2 toEdge = min(p - uOrigin, uOrigin + uCanvas * uUpp - p);
        float win = smoothstep(0.0, 0.22, min(toEdge.x, toEdge.y));
        glow *= win;
        shadow *= win;

        float far = 4.0 * uEdge.x * uUcss + 2.0 * aa;
        if (sdOut - uDeform / uScale > far) {
          outColor = vec4(glow + dither / 255.0, shadow);
          return;
        }
        if (uDeform > 0.0) {
          for (int i = 0; i < 2; i++) {
            D = lattice(uGridTex, q);
            q = (p - D.xy) / uScale;
          }
        }

        float sd = sdRR(q, uHalf, uRad);
        float sdHem = sdRR(q - vec2(0.0, hem * 0.5), uHalf + vec2(0.0, hem * 0.5), uRad);
        sdOut = min(sd, sdHem);
        if (sdOut > far) {
          outColor = vec4(glow + dither / 255.0, shadow);
          return;
        }

        vec4 nz = texture(uNoise, q / uUcss / 256.0);
        float grain = nz.r - 0.5;
        float fz = (texture(uNoise, q / (uUcss * 0.9) / 256.0 + 0.37).b - 0.35) * uEdge.x * uUcss;
        float cover = clamp(0.5 - (sdOut + fz) / aa, 0.0, 1.0);

        vec2 cuv = (q + vec2(0.0, ${FOLD_DRIFT.toFixed(2)} * D.z)) / vec2(${CLOTH_TX.toFixed(2)}, ${CLOTH_TY.toFixed(2)});
        vec4 cA = texture(uCloth, cuv);
        float th = uPhase + 0.35 * sin(1.3 * q.x + 0.7) + 0.25 * sin(2.1 * q.y - 0.9 * q.x);
        float k0 = floor(th);
        float sw = (th - k0) * 1.5707963;
        vec4 cB = texture(uCloth, cuv + crawlOffset(k0)) * cos(sw) + texture(uCloth, cuv + crawlOffset(k0 + 1.0)) * sin(sw);
        float napFix = mix(0.8, 0.3, uActive);
        float nap = napFix * cA.r + sqrt(1.0 - napFix * napFix) * cB.r;
        vec4 cl = vec4(nap, cB.gba);

        float e = max(-sd, 0.0);
        float eps = max(uUpp * 1.5, 0.002);
        float z0 = pillow(e);
        float zx = pillow(max(-sdRR(q + vec2(eps, 0.0), uHalf, uRad), 0.0));
        float zy = pillow(max(-sdRR(q + vec2(0.0, eps), uHalf, uRad), 0.0));
        vec2 g = vec2(zx - z0, zy - z0) / eps;
        if (uDeform > 0.0) g += lattice(uGridGrad, q).xy;
        float wr = uLook.z * (0.006 + 0.018 * max(uInflate - ${REST_PUFF.toFixed(2)}, 0.0) + 0.035 * D.w) * smoothstep(0.0, 0.08, e);
        wr *= clamp(0.65 + 0.45 * nap, 0.15, 1.5);
        g += wr * cl.ba;
        vec3 N = normalize(vec3(-g, 1.0));
        vec2 lxy = normalize(uLight.xy + 1e-5);
        float illum = clamp(1.0 + ${LIGHT_FALLOFF.toFixed(3)} * dot(q, lxy), 0.4, 1.6);
        vec3 face = velour(N, uFabric, nap, grain, illum);
        face *= 1.0 - clamp(-cl.g * wr * (7.0 + 5.0 * D.w), 0.0, 0.5);

        if (uInkOn > 0.5) {
          vec2 luv = q / (uHalf * 2.0) + 0.5;
          float ink = texture(uLabel, luv).a;
          if (ink > 0.002) {
            float pin = smoothstep(0.04, 0.3, nz.g);
            ink *= mix(1.0, pin, min(1.0, 0.75 * uLook.y));
            float NoL = dot(N, uLight);
            float diff = clamp((NoL + 0.5) / 1.5, 0.0, 1.0);
            vec3 inkCol = uInk * (0.55 + 0.6 * diff) * (1.0 + 0.3 * uLook.y * grain);
            face = mix(face, inkCol, ink * smoothstep(0.0, 0.03, e));
          }
        }

        vec3 col = face;
        if (sd > -aa) {
          vec2 n2 = nRR(q, uHalf, uRad);
          float s = clamp(sd / max(hem, 1e-4), 0.0, 1.0);
          float th = mix(1.0, 1.38, s);
          vec3 Nh = normalize(vec3(n2 * sin(th), cos(th)));
          vec3 hc = velour(Nh, uFabric * 0.8, nap, grain, illum);
          hc *= mix(0.45, 1.0, smoothstep(0.0, 0.45, s));
          col = mix(hc, face, clamp(0.5 - sd / aa, 0.0, 1.0));
        }

        vec3 rgb = toSrgb(col);
        float a = cover + (1.0 - cover) * shadow;
        outColor = vec4(rgb * cover + glow * (1.0 - cover) + dither / 255.0, a);
      }`;

      const root = document.getElementById("bolsterRoot");
      const stage = document.getElementById("bolsterStage");
      const canvas = document.getElementById("bolsterCanvas");
      const hit = document.getElementById("bolsterHit");
      const gl = canvas.getContext("webgl2", {
        alpha: true,
        premultipliedAlpha: true,
        antialias: false,
        depth: false,
        stencil: false,
        powerPreference: "low-power",
      });

      if (!gl) {
        hit.textContent = CFG.text;
        hit.style.width = CFG.buttonWidth + "px";
        hit.style.height = CFG.buttonHeight + "px";
        hit.style.background = CFG.fabric;
        hit.style.color = CFG.textColor;
        hit.style.display = "flex";
        hit.style.alignItems = "center";
        hit.style.justifyContent = "center";
        hit.style.textDecoration = "none";
        hit.style.fontWeight = "800";
        return;
      }

      const vs = gl.createShader(gl.VERTEX_SHADER);
      const fs = gl.createShader(gl.FRAGMENT_SHADER);
      const prog = gl.createProgram();
      gl.shaderSource(vs, VERT);
      gl.shaderSource(fs, FRAG);
      gl.compileShader(vs);
      gl.compileShader(fs);
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);
      gl.useProgram(prog);

      const loc = {};
      [
        "uCanvas", "uOrigin", "uUpp", "uUcss", "uHalf", "uRad", "uGrid", "uDeform", "uInflate", "uScale", "uPhase", "uActive",
        "uFabric", "uSheenCol", "uInk", "uInkOn", "uLight", "uLook", "uEdge",
        "uGridTex", "uCloth", "uNoise", "uLabel", "uGridGrad"
      ].forEach((n) => { loc[n] = gl.getUniformLocation(prog, n); });

      gl.uniform1i(loc.uGridTex, 0);
      gl.uniform1i(loc.uCloth, 1);
      gl.uniform1i(loc.uNoise, 2);
      gl.uniform1i(loc.uLabel, 3);
      gl.uniform1i(loc.uGridGrad, 4);
      gl.disable(gl.BLEND);

      function makeTex(filter, wrap) {
        const t = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, t);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
        return t;
      }

      const texGrid = makeTex(gl.LINEAR, gl.CLAMP_TO_EDGE);
      const texGrad = makeTex(gl.LINEAR, gl.CLAMP_TO_EDGE);
      const texCloth = makeTex(gl.LINEAR, gl.REPEAT);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, CLOTH_W, CLOTH_H, 0, gl.RGBA, gl.FLOAT, bakeCloth());
      const texNoise = makeTex(gl.LINEAR, gl.REPEAT);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 256, 256, 0, gl.RGBA, gl.UNSIGNED_BYTE, bakeNoise());
      const texLabel = makeTex(gl.LINEAR_MIPMAP_LINEAR, gl.CLAMP_TO_EDGE);

      const labelCanvas = document.createElement("canvas");
      let labelUploaded = false;
      function uploadLabel(bwPx, bhPx, scale) {
        if (labelUploaded) return;
        labelUploaded = true;
        const W = Math.max(1, Math.min(1024, Math.round(bwPx * scale)));
        const H = Math.max(1, Math.min(512, Math.round(bhPx * scale)));
        labelCanvas.width = W;
        labelCanvas.height = H;
        const ctx = labelCanvas.getContext("2d");
        ctx.clearRect(0, 0, W, H);
        const fs = Math.min(H * 0.32, W * 0.22);
        ctx.font = `800 ${fs.toFixed(1)}px "Plus Jakarta Sans", "Helvetica Neue", Helvetica, Arial, sans-serif`;
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(CFG.text, W / 2, H / 2 + 1);
        gl.activeTexture(gl.TEXTURE3);
        gl.bindTexture(gl.TEXTURE_2D, texLabel);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, labelCanvas);
        gl.generateMipmap(gl.TEXTURE_2D);
      }

      function makeLattice(hw, r) {
        const spanX = 2 * (hw + MARGIN);
        const spanY = 2 * (0.5 + MARGIN);
        const nx = clamp(Math.round(spanX / GRID_PITCH) + 1, 8, 160);
        const ny = clamp(Math.round(spanY / GRID_PITCH) + 1, 8, 96);
        const n = nx * ny;
        const dirX = new Float32Array(n);
        const dirY = new Float32Array(n);
        const ox = -spanX / 2;
        const oy = -spanY / 2;
        const ix = Math.max(0, hw - r);
        const iy = Math.max(0, 0.5 - r);
        for (let j = 0; j < ny; j++) {
          for (let i = 0; i < nx; i++) {
            const k = j * nx + i;
            const x = ox + (spanX * i) / (nx - 1);
            const y = oy + (spanY * j) / (ny - 1);
            const dx = x - clamp(x, -ix, ix);
            const dy = y - clamp(y, -iy, iy);
            const len = Math.hypot(dx, dy);
            const reachIn = clamp((len - (0.5 - RIM_ZONE)) / RIM_ZONE, 0, 1);
            const k2 = (reachIn * reachIn * (3 - 2 * reachIn)) / Math.max(len, 1e-3);
            dirX[k] = dx * k2;
            dirY[k] = dy * k2;
          }
        }
        return {
          nx, ny, ox, oy, spanX, spanY, dirX, dirY,
          d: new Float32Array(n * 3),
          v: new Float32Array(n * 3),
          r: new Float32Array(n),
          rv: new Float32Array(n),
          gx: new Float32Array(nx * 3),
          gy: new Float32Array(ny * 3),
          tex: new Float32Array(n * 4),
          grad: new Float32Array(n * 2),
        };
      }

      const bwPx = CFG.buttonWidth;
      const bhPx = CFG.buttonHeight;
      const hw = bwPx / bhPx / 2;
      const rr = CFG.radius / bhPx;
      const mPx = MARGIN * bhPx;
      const cssW = bwPx + 2 * mPx;
      const cssH = bhPx + 2 * mPx;

      stage.style.width = cssW + "px";
      stage.style.height = cssH + "px";
      hit.style.width = bwPx + "px";
      hit.style.height = bhPx + "px";
      hit.style.borderRadius = CFG.radius + "px";

      const L = makeLattice(hw, rr);
      const fabricLin = hexToLin(CFG.fabric);
      const inkLin = hexToLin(CFG.textColor);
      const mx = Math.max(fabricLin[0], fabricLin[1], fabricLin[2], 1e-4);
      const sheenLin = fabricLin.map((v) => (v / mx) * 0.95 + 0.008);

      const state = {
        hov: 0, relT: -1, relFrom: 0, dwell: 0, hovTarget: 0,
        cx: 0, cy: 0, pvx: 0, pvy: 0,
        press: 0, pressV: 0, pressTarget: 0,
        inf: 0, infV: 0, acc: 0, phase: 0, act: 0,
      };
      const pt = { has: false, x: 0, y: 0, down: false, bx: 0, by: 0 };

      root.addEventListener("pointermove", (e) => {
        pt.x = e.clientX;
        pt.y = e.clientY;
        pt.has = true;
      });
      root.addEventListener("pointerdown", (e) => {
        pt.x = e.clientX;
        pt.y = e.clientY;
        pt.has = true;
        pt.down = true;
      });
      window.addEventListener("pointerup", () => {
        pt.down = false;
      });
      root.addEventListener("pointerleave", () => {
        pt.has = false;
        pt.down = false;
      });

      const dampScale = () => Math.exp(-0.13 * (CFG.wobble - 5));

      function stepLattice() {
        const bulge = CFG.bulge / 5;
        const pressK = CFG.press / 5;
        const dragK = (CFG.drag / 5) * 3.8;
        const rippleK = CFG.ripple / 5;
        const memK = MEM_W * MEM_W;
        const damp = 2 * MEM_W * dampScale();
        const h = L.spanX / (L.nx - 1);
        const hy = L.spanY / (L.ny - 1);
        const Tx = MEM_T / (h * h);
        const Ty = MEM_T / (hy * hy);
        const Wx = (RIPPLE_SPEED * RIPPLE_SPEED) / (h * h);
        const Wy = (RIPPLE_SPEED * RIPPLE_SPEED) / (hy * hy);
        const inv2s = 1 / (2 * SWELL_SIGMA * SWELL_SIGMA);
        const inv2p = 1 / (2 * PRESS_SIGMA * PRESS_SIGMA);
        const inv2r = 1 / (2 * RIPPLE_SIGMA * RIPPLE_SIGMA);
        const wake = 1 + Math.min(WAKE_MAX, WAKE_GAIN * Math.hypot(state.pvx, state.pvy)) * (CFG.drag / 5);
        const amp = ((1 - DWELL_SHARE) * state.hov * state.hov + DWELL_SHARE * state.dwell) * bulge * wake;
        const pr = state.press * pressK;
        const { nx, ny, d, v, r, rv, dirX, dirY, gx, gy } = L;
        const pvx = clamp(state.pvx, -12, 12);
        const pvy = clamp(state.pvy, -12, 12);
        const dvx = pvx * dragK * state.hov;
        const dvy = pvy * dragK * state.hov;
        const stir = rippleK * state.hov * Math.min(Math.hypot(pvx, pvy), 8) * RIPPLE_GAIN;
        const driven = amp > 1e-5 || pr > 1e-5;
        const active = driven || stir > 0 || dvx !== 0 || dvy !== 0;

        if (active) {
          for (let i = 0; i < nx; i++) {
            const t = L.ox + (L.spanX * i) / (nx - 1) - state.cx;
            const t2 = t * t;
            gx[i * 3] = Math.exp(-t2 * inv2s);
            gx[i * 3 + 1] = Math.exp(-t2 * inv2p);
            gx[i * 3 + 2] = Math.exp(-t2 * inv2r);
          }
          for (let j = 0; j < ny; j++) {
            const t = L.oy + (L.spanY * j) / (ny - 1) - state.cy;
            const t2 = t * t;
            gy[j * 3] = Math.exp(-t2 * inv2s);
            gy[j * 3 + 1] = Math.exp(-t2 * inv2p);
            gy[j * 3 + 2] = Math.exp(-t2 * inv2r);
          }
        }

        for (let j = 1; j < ny - 1; j++) {
          for (let i = 1; i < nx - 1; i++) {
            const k = j * nx + i;
            let tx = 0, ty = 0, tz = 0, gs = 0, gr = 0;
            if (active) {
              gs = gx[i * 3] * gy[j * 3];
              gr = gx[i * 3 + 2] * gy[j * 3 + 2];
              if (driven) {
                const gp = gx[i * 3 + 1] * gy[j * 3 + 1];
                const out = amp * (SWELL_XY * gs - FAR_SHRINK * (1 - gs)) + pr * gp * 0.04;
                tx = dirX[k] * out;
                ty = dirY[k] * out;
                tz = amp * gs * SWELL_Z - pr * gp * PRESS_Z;
              }
            }
            const k3 = k * 3;
            const kl = k3 - 3, kr = k3 + 3, ku = k3 - nx * 3, kd = k3 + nx * 3;
            v[k3] += (memK * (tx - d[k3]) + Tx * (d[kl] + d[kr] - 2 * d[k3]) + Ty * (d[ku] + d[kd] - 2 * d[k3]) - damp * v[k3] + dvx * gs) * STEP;
            v[k3 + 1] += (memK * (ty - d[k3 + 1]) + Tx * (d[kl + 1] + d[kr + 1] - 2 * d[k3 + 1]) + Ty * (d[ku + 1] + d[kd + 1] - 2 * d[k3 + 1]) - damp * v[k3 + 1] + dvy * gs) * STEP;
            v[k3 + 2] += (memK * (tz - d[k3 + 2]) + Tx * (d[kl + 2] + d[kr + 2] - 2 * d[k3 + 2]) + Ty * (d[ku + 2] + d[kd + 2] - 2 * d[k3 + 2]) - damp * v[k3 + 2]) * STEP;
            rv[k] += (Wx * (r[k - 1] + r[k + 1] - 2 * r[k]) + Wy * (r[k - nx] + r[k + nx] - 2 * r[k]) - RIPPLE_DAMP * rv[k] - 40 * r[k] + stir * gr) * STEP;
          }
        }

        for (let k = 0; k < nx * ny; k++) {
          const k3 = k * 3;
          d[k3] += v[k3] * STEP;
          d[k3 + 1] += v[k3 + 1] * STEP;
          d[k3 + 2] += v[k3 + 2] * STEP;
          r[k] += rv[k] * STEP;
        }
      }

      let lastNow = 0;
      let firstUpload = true;

      function frame(now) {
        const dt = lastNow ? Math.min(0.1, (now - lastNow) / 1000) : 1 / 60;
        lastNow = now;

        const rect = hit.getBoundingClientRect();
        if (pt.has && rect.width > 0 && rect.height > 0) {
          pt.bx = (pt.x - (rect.left + rect.width / 2)) / bhPx;
          pt.by = (pt.y - (rect.top + rect.height / 2)) / bhPx;
        }

        const qx = Math.abs(pt.bx) - hw + rr;
        const qy = Math.abs(pt.by) - 0.5 + rr;
        const sdPointer = Math.min(Math.max(qx, qy), 0) + Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) - rr;
        const target = pt.has && sdPointer <= (state.hovTarget > 0 ? HOVER_HYST : 0) ? 1 : 0;
        state.hovTarget = target;
        state.pressTarget = pt.down && target > 0 ? 1 : 0;
        const tx = pt.has ? pt.bx : state.cx;
        const ty = pt.has ? pt.by : state.cy;

        state.acc = Math.min(state.acc + dt, 0.1);
        while (state.acc >= STEP) {
          state.acc -= STEP;
          if (state.hovTarget > state.hov) {
            state.hov += (state.hovTarget - state.hov) * (1 - Math.exp(-STEP / 0.05));
            state.relT = -1;
          } else if (state.hov > 0) {
            if (state.relT < 0) {
              state.relT = 0;
              state.relFrom = state.hov;
            }
            state.relT += STEP;
            const u = Math.min(1, state.relT / Math.max(0.05, CFG.release));
            state.hov = state.relFrom * (1 - u * u * (3 - 2 * u));
          }
          if (state.hovTarget > 0) state.dwell += (state.hov - state.dwell) * (1 - Math.exp(-STEP / DWELL_TAU));
          state.dwell = Math.min(state.dwell, state.hov);

          const kc = 1 - Math.exp(-STEP / 0.05);
          const ncx = state.cx + (tx - state.cx) * kc;
          const ncy = state.cy + (ty - state.cy) * kc;
          const kv = 1 - Math.exp(-STEP / 0.06);
          state.pvx += ((ncx - state.cx) / STEP - state.pvx) * kv;
          state.pvy += ((ncy - state.cy) / STEP - state.pvy) * kv;
          state.cx = ncx;
          state.cy = ncy;

          const wp = 2 * Math.PI * (state.pressTarget > state.press ? 6 : 3.2);
          const zp = Math.min(1, 0.55 * dampScale());
          state.pressV += (wp * wp * (state.pressTarget - state.press) - 2 * zp * wp * state.pressV) * STEP;
          state.press += state.pressV * STEP;

          const puff = CFG.puff / 5;
          const it = ((1 - DWELL_SHARE) * state.hov + DWELL_SHARE * state.dwell) * puff - state.press * 0.35 * (CFG.press / 5);
          state.infV += (INF_W * INF_W * (it - state.inf) - 2 * INF_W * dampScale() * state.infV) * STEP;
          state.inf += state.infV * STEP;

          const act = Math.min(1, Math.max(state.hov, Math.abs(state.inf)));
          state.act = act;
          state.phase = (state.phase + (CFG.drift / 5) * (CRAWL_REST + CRAWL_ACTIVE * act) * STEP) % CRAWL_CYCLE;
          stepLattice();
        }

        const dpr = Math.min(2, window.devicePixelRatio || 1);
        const pw = Math.max(1, Math.round(cssW * dpr));
        const ph = Math.max(1, Math.round(cssH * dpr));
        if (canvas.width !== pw || canvas.height !== ph) {
          canvas.width = pw;
          canvas.height = ph;
        }
        gl.viewport(0, 0, pw, ph);
        uploadLabel(bwPx, bhPx, Math.min(3, dpr * 1.25));

        const Lt = L.tex;
        const Lg = L.grad;
        const hx = L.spanX / (L.nx - 1);
        const hy = L.spanY / (L.ny - 1);
        const D3 = L.d;
        const R1 = L.r;
        let maxXY = 0;
        for (let j = 0; j < L.ny; j++) {
          for (let i = 0; i < L.nx; i++) {
            const k = j * L.nx + i;
            const il = i > 0 ? k - 1 : k;
            const ir = i < L.nx - 1 ? k + 1 : k;
            const ju = j > 0 ? k - L.nx : k;
            const jd = j < L.ny - 1 ? k + L.nx : k;
            const sx = 1 / (hx * (ir - il || 1));
            const sy = 1 / (hy * ((jd - ju) / L.nx || 1));
            const exx = (D3[ir * 3] - D3[il * 3]) * sx;
            const eyy = (D3[jd * 3 + 1] - D3[ju * 3 + 1]) * sy;
            const exy = 0.5 * ((D3[jd * 3] - D3[ju * 3]) * sy + (D3[ir * 3 + 1] - D3[il * 3 + 1]) * sx);
            const dx = D3[k * 3], dy = D3[k * 3 + 1], dz = D3[k * 3 + 2];
            if (Math.abs(dx) > maxXY) maxXY = Math.abs(dx);
            if (Math.abs(dy) > maxXY) maxXY = Math.abs(dy);
            Lt[k * 4] = dx;
            Lt[k * 4 + 1] = dy;
            Lt[k * 4 + 2] = dz;
            Lt[k * 4 + 3] = Math.min(1, 2.6 * Math.sqrt(exx * exx + eyy * eyy + 2 * exy * exy) + 2.2 * Math.abs(dz));
            Lg[k * 2] = (D3[ir * 3 + 2] - D3[il * 3 + 2] + R1[ir] - R1[il]) * sx;
            Lg[k * 2 + 1] = (D3[jd * 3 + 2] - D3[ju * 3 + 2] + R1[jd] - R1[ju]) * sy;
          }
        }

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, texGrid);
        if (firstUpload) {
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, L.nx, L.ny, 0, gl.RGBA, gl.FLOAT, Lt);
          gl.activeTexture(gl.TEXTURE4);
          gl.bindTexture(gl.TEXTURE_2D, texGrad);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG16F, L.nx, L.ny, 0, gl.RG, gl.FLOAT, Lg);
          firstUpload = false;
        } else {
          gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, L.nx, L.ny, gl.RGBA, gl.FLOAT, Lt);
          gl.activeTexture(gl.TEXTURE4);
          gl.bindTexture(gl.TEXTURE_2D, texGrad);
          gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, L.nx, L.ny, gl.RG, gl.FLOAT, Lg);
        }
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, texCloth);
        gl.activeTexture(gl.TEXTURE2);
        gl.bindTexture(gl.TEXTURE_2D, texNoise);
        gl.activeTexture(gl.TEXTURE3);
        gl.bindTexture(gl.TEXTURE_2D, texLabel);

        const upp = 1 / (bhPx * dpr);
        gl.uniform2f(loc.uCanvas, pw, ph);
        gl.uniform2f(loc.uOrigin, -cssW / 2 / bhPx, -cssH / 2 / bhPx);
        gl.uniform1f(loc.uUpp, upp);
        gl.uniform1f(loc.uUcss, 1 / bhPx);
        gl.uniform2f(loc.uHalf, hw, 0.5);
        gl.uniform1f(loc.uRad, rr);
        gl.uniform4f(loc.uGrid, L.ox, L.oy, L.spanX, L.spanY);
        gl.uniform1f(loc.uDeform, maxXY > 1e-6 ? Math.max(maxXY * 1.42, 1e-5) : 0);
        gl.uniform1f(loc.uInflate, REST_PUFF + Math.max(-0.5, state.inf));
        gl.uniform1f(loc.uPhase, state.phase);
        gl.uniform1f(loc.uActive, state.act);
        gl.uniform1f(loc.uScale, 1 + HOVER_GROW * state.inf - PRESS_SQUASH * Math.max(0, state.press) * (CFG.press / 5));
        gl.uniform3f(loc.uFabric, fabricLin[0], fabricLin[1], fabricLin[2]);
        gl.uniform3f(loc.uSheenCol, sheenLin[0], sheenLin[1], sheenLin[2]);
        gl.uniform3f(loc.uInk, inkLin[0], inkLin[1], inkLin[2]);
        gl.uniform1f(loc.uInkOn, 1);

        const la = (CFG.lightAngle * Math.PI) / 180;
        const le = (clamp(CFG.lightHeight, 1, 89) * Math.PI) / 180;
        gl.uniform3f(loc.uLight, Math.sin(la) * Math.cos(le), -Math.cos(la) * Math.cos(le), Math.sin(le));
        gl.uniform4f(loc.uLook, CFG.nap / 100, CFG.pile / 100, CFG.wrinkles / 100, CFG.sheen / 100);
        gl.uniform4f(loc.uEdge, CFG.fuzz, (CFG.hem / 100) * (1 + 0.15 * Math.max(0, state.inf)), CFG.shadow / 100, CFG.glow / 100);

        gl.drawArrays(gl.TRIANGLES, 0, 3);
        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
